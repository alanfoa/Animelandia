    <link rel="stylesheet" href="styles.css">
    <style>
        .content {
            max-width: 1100px;
            margin: 20px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: var(--text-color);
        }

        .meta-info { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .genre-tag { background: #e0e0e0; color: #333; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; transition: 0.2s; cursor: default; }
        .genre-tag:hover { background: #a0a0a0; transform: scale(1.08); }
        .rating-tag { background: #FFF; color: #000; padding: 5px 12px; border-radius: 15px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 5px; transition: 0.2s; cursor: default; }
        .rating-tag:hover { background: #f0f0f0; transform: scale(1.08); }
        .year-tag { background: var(--racing-celeste); color: white; padding: 5px 12px; border-radius: 15px; font-size: 13px; font-weight: bold; transition: 0.2s; cursor: default; }
        .year-tag:hover { background: #007b9a; transform: scale(1.08); }
        .type-tag { background: #6f42c1; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; text-transform: uppercase; transition: 0.2s; cursor: default; }
        .type-tag:hover { background: #3d1f7a; transform: scale(1.08); }
        .status-tag { padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; transition: 0.2s; cursor: default; text-transform: uppercase; }
        .status-tag.airing { background: #27ae60; color: white; }
        .status-tag.finished { background: #e74c3c; color: white; }
        .status-tag.upcoming { background: #f39c12; color: white; }
        .status-tag.unknown { background: #95a5a6; color: white; }
        .next-episode-tag { background: linear-gradient(135deg, #00b894, #00cec9); color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; transition: 0.2s; cursor: default; display: inline-flex; align-items: center; gap: 5px; }
        .next-episode-tag:hover { transform: scale(1.08); box-shadow: 0 2px 8px rgba(0, 206, 201, 0.4); }
        .relacion-tag { background: #e8daef; color: #6c3483; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; transition: 0.2s; cursor: pointer; text-decoration: none; display: inline-block; }
        .relacion-tag:hover { background: #d2b4de; transform: scale(1.08); }

        #reproductor { display: none; margin-bottom: 25px; background: #000; padding: 15px; border-radius: 12px; border: 4px solid var(--racing-celeste); }
        .lista-servidores { display: flex; justify-content: center; gap: 8px; margin: 15px 0; flex-wrap: wrap; }
        .btn-servidor { background: var(--racing-celeste); color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .nav-cap { display: flex; justify-content: center; gap: 12px; margin: 12px 0; }
        .btn-nav-cap { background: var(--racing-celeste); color: white; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 13px; }
        .btn-nav-cap:hover { opacity: 0.9; transform: scale(1.05); }
        .btn-nav-cap:disabled { opacity: 0.4; cursor: default; transform: none; }
        .btn-nav-cap.highlight { position: relative; box-shadow: 0 0 12px rgba(0,174,239,0.5); animation: pulse-glow 1.8s ease-in-out infinite; }
        @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 6px rgba(0,174,239,0.3); } 50% { box-shadow: 0 0 18px rgba(0,174,239,0.7); } }

        .download-wrap { position: relative; margin-left: auto; }
        .btn-download { background: var(--racing-celeste); color: white; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 13px; white-space: nowrap; }
        .btn-download:hover { opacity: 0.9; transform: scale(1.05); }
        .download-menu { position: absolute; bottom: calc(100% + 8px); right: 0; background: var(--card-bg); border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: none; flex-direction: column; min-width: 170px; z-index: 100; overflow: hidden; }
        .download-menu.show { display: flex; }
        .download-menu a { padding: 10px 16px; color: var(--text-color); text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.15s; border-bottom: 1px solid #ddd; }
        .download-menu a:last-child { border-bottom: none; }
        .download-menu a:hover { background: var(--racing-celeste); color: white; }

        .grid-caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .cap-card { position: relative; cursor: pointer; overflow: hidden; border-radius: 10px; transition: 0.3s; aspect-ratio: 16 / 9; background: #000; }
        .cap-card:hover { transform: scale(1.05); }
        .cap-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .cap-label { position: absolute; bottom: 10px; left: 10px; background: var(--racing-celeste); color: white; padding: 4px 10px; border-radius: 5px; font-weight: bold; font-size: 12px; z-index: 2; }
        
        .info-header { display: flex; gap: 25px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        .info-header img { width: 220px; max-width: 100%; height: auto; display: block; margin: 0 auto 15px auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); }

        .container-favs { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-fav { background: var(--card-bg); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); cursor: pointer; transition: 0.3s; position: relative; }
        .card-fav img { width: 100%; height: 250px; object-fit: cover; background: #000; }
        .card-fav-info { padding: 10px; text-align: center; font-size: 13px; font-weight: bold; height: 35px; display: flex; align-items: center; justify-content: center; color: var(--text-color); }
        
        #btn-cargar-mas { width: 100%; margin-top: 20px; padding: 15px; background: #eee; color: #333; border: 2px dashed #ccc; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .caps-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 30px; }

        /* Paginación para episodios */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 30px 20px;
        }

        .pagination-container a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #ddd;
        }

        .pagination-container a:hover {
            background: var(--racing-celeste);
            color: white;
            border-color: var(--racing-celeste);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 174, 239, 0.3);
        }

        .pagination-container a.active {
            background: var(--racing-celeste);
            color: white;
            border-color: var(--racing-celeste);
            pointer-events: none;
        }

        .pagination-container a.disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: default;
        }

        .pagination-container span {
            color: var(--text-color);
            opacity: 0.5;
        }

        .pagination-container a.prev-btn,
        .pagination-container a.next-btn,
        .pagination-container a.last-btn,
        .pagination-container a.first-btn {
            font-weight: bold;
            min-width: 50px;
        }

        @media (max-width: 768px) {
            .pagination-container {
                gap: 4px;
                padding: 20px 10px;
            }
            
            .pagination-container a {
                min-width: 35px;
                height: 35px;
                font-size: 12px;
                padding: 0 8px;
            }
        }
        .btn-orden-caps { background: none; border: 1px solid var(--racing-celeste); color: var(--racing-celeste); border-radius: 50%; width: 36px; height: 36px; font-size: 16px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .btn-orden-caps:hover { background: var(--racing-celeste); color: white; }
        .search-cap-container { display: flex; align-items: center; gap: 8px; background: var(--dark-bg); padding: 8px 15px; border-radius: 25px; border: 1px solid #ddd; }
        .search-cap-container input { border: none; background: transparent; outline: none; width: 120px; font-size: 14px; font-weight: bold; color: var(--text-color); }

        @media (max-width: 768px) {
            header img { height: 70px; }
            .btn-mode { right: 10px; width: 35px; height: 35px; font-size: 16px; }
            .search-box { flex-direction: column; gap: 12px; padding: 15px; }
            .search-box button { width: 100%; padding: 15px; }
            input[type="text"] { width: 100%; box-sizing: border-box; }
            .info-header { flex-direction: column; align-items: center; text-align: center; }
            .info-header img { width: 70%; max-width: 250px; margin-bottom: 15px; }
            #titulo-anime { font-size: 1.5rem !important; margin-bottom: 5px; color: var(--text-color); }
            #sinopsis { font-size: 14px; line-height: 1.4; color: var(--text-color); }
        }

    </style>
</head>

    <script>
        // API URL: usa localhost en desarrollo, Render en producción
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3001' : 'https://animelandia-api-6wp2.onrender.com';
        const isLocal = API_URL.startsWith('http://localhost');

        function getSource() { return localStorage.getItem('animeSource') || 'av1'; }
        function withSource(url) { return getSource() === 'tio' ? url + (url.includes('?') ? '&' : '?') + 'source=tio' : url; }
        function toggleSource() {
            const next = getSource() === 'av1' ? 'tio' : 'av1';
            localStorage.setItem('animeSource', next);
            location.reload();
        }
        function updateSourceToggle() {
            const src = getSource();
            const circle = document.getElementById('source-circle');
            const icon = document.getElementById('source-icon');
            if (src === 'tio') {
                circle.style.left = 'calc(100% - 30px)';
                icon.src = 'https://tioanime.com/assets/img/icon-32x32.png';
            } else {
                circle.style.left = '4px';
                icon.src = 'https://animeav1.com/favicon.png';
            }
        }
        updateSourceToggle();

        // Variables globales
        let favoritos = [];
        let allEpisodes = [];
        let capsPage = 1;
        let ordenAscendente = false;
        const capsPerPage = 50;
        let slug = '';
        let titulo = '';
        let imagenUrl = '';
        let currentCap = null;
        let downloads = [];

        // LÓGICA MODO OSCURO (NUEVO) - Default: Dark mode
        function toggleTheme() {
            const html = document.documentElement;
            const toggleCircle = document.getElementById('toggle-circle');
            
            if (html.getAttribute('data-theme') === 'dark') {
                // Cambiar a modo claro
                html.removeAttribute('data-theme');
                toggleCircle.style.left = '4px';
                toggleCircle.innerHTML = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                // Cambiar a modo oscuro
                html.setAttribute('data-theme', 'dark');
                toggleCircle.style.left = 'calc(100% - 30px)';
                toggleCircle.innerHTML = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        // APLICAR TEMA GUARDADO AL CARGAR - Default is dark
        if (localStorage.getItem('theme') === 'light') {
            // Modo claro: sol a la izquierda
            document.documentElement.removeAttribute('data-theme');
            document.getElementById('toggle-circle').style.left = '4px';
            document.getElementById('toggle-circle').innerHTML = '☀️';
        } else {
            // Default to dark mode: luna a la derecha
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('toggle-circle').style.left = 'calc(100% - 30px)';
            document.getElementById('toggle-circle').innerHTML = '🌙';
        }

        window.onload = async () => {

            const pathMatch = window.location.pathname.match(/^\/anime\/([^/]+)/);
            const params = new URLSearchParams(window.location.search);
            if (pathMatch) {
                slug = pathMatch[1];
                const cached = sessionStorage.getItem(`anime-info-${slug}`);
                if (cached) {
                    try { const p = JSON.parse(cached); titulo = p.titulo || ''; imagenUrl = p.imagen || ''; } catch(e) {}
                }
            } else {
                slug = params.get('slug') || '';
                titulo = decodeURIComponent(params.get('titulo') || '');
                imagenUrl = decodeURIComponent(params.get('imagen') || '');
            }
            favoritos = JSON.parse(localStorage.getItem('misAnimes')) || [];
            
            if (titulo) {
                document.getElementById('titulo-anime').innerText = titulo;
                document.title = `${titulo} - Animelandia`;
            }
            if (imagenUrl) {
                document.getElementById('img-anime').src = imagenUrl;
                document.getElementById('img-anime').loading = 'lazy';
            }

            // Verificar si ya es favorito al cargar
            const btnFav = document.getElementById('btn-fav-anime');
            const favIcon = btnFav ? btnFav.querySelector('.favorite-icon') : null;
            if (btnFav && favoritos.some(f => f.slug === slug)) {
                if (favIcon) favIcon.classList.add('active');
            }

            renderizarFavoritosDetalle();
            
            if (!slug) return;
            
            try {
                let data;
                const cacheKey = `anime-info-${slug}`;
                const cached = sessionStorage.getItem(cacheKey);
                const now = Date.now();
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (now - parsed._time < 3600000) {
                        data = parsed;
                    } else {
                        sessionStorage.removeItem(cacheKey);
                    }
                }
                if (!data) {
                    const res = await fetch(withSource(`${API_URL}/anime-info?slug=${slug}`));
                    data = await res.json();
                    data._time = now;
                    sessionStorage.setItem(cacheKey, JSON.stringify(data));
                }
                document.getElementById('sinopsis').innerText = data.descripcion || "Sin descripción.";
                document.getElementById('rating-val').innerText = data.rating || "0.0";
                const genreDiv = document.getElementById('lista-generos');
                genreDiv.innerHTML = '';
                
                // Mostrar estado del anime (Finalizado, En emisión, Próximamente)
                if (data.status !== undefined) {
                    const statusSpan = document.createElement('span');
                    statusSpan.className = 'status-tag';
                    const statusMap = { '0': 'Finalizado', '1': 'Finalizado', '2': 'En emisión', '3': 'Próximamente' };
                    const colorMap = { '0': 'finished', '1': 'finished', '2': 'airing', '3': 'upcoming' };
                    statusSpan.innerText = statusMap[data.status] || 'Desconocido';
                    statusSpan.classList.add(colorMap[data.status] || 'unknown');
                    genreDiv.appendChild(statusSpan);
                }
                
                // Mostrar tipo de anime (TV Anime, Película, OVA, Especial)
                if (data.tipo) {
                    const typeSpan = document.createElement('span');
                    typeSpan.className = 'type-tag';
                    typeSpan.innerText = data.tipo;
                    genreDiv.appendChild(typeSpan);
                }
                
                if (data.anio) {
                    const yearSpan = document.createElement('span');
                    yearSpan.className = 'year-tag';
                    yearSpan.innerText = `Año: ${data.anio}`;
                    genreDiv.appendChild(yearSpan);
                }
                if (data.generos) data.generos.forEach(g => {
                    const span = document.createElement('span'); span.className = 'genre-tag'; span.innerText = g; genreDiv.appendChild(span);
                });

                // Mostrar próximo capítulo (calcula con waitDays)
                if (data.nextDate && data.waitDays && data.status === '2') {
                    const hoy = new Date();
                    hoy.setHours(0, 0, 0, 0);
                    let fecha = new Date(data.nextDate + 'T00:00:00');
                    const wait = parseInt(data.waitDays);
                    while (fecha <= hoy) {
                        fecha.setDate(fecha.getDate() + wait);
                    }
                    const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
                    const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
                    const nextSpan = document.createElement('span');
                    nextSpan.className = 'next-episode-tag';
                    nextSpan.innerHTML = `📅 Próximo Cap: ${dias[fecha.getDay()]} ${fecha.getDate()} de ${meses[fecha.getMonth()]}`;
                    genreDiv.appendChild(nextSpan);
                }

                // Mostrar relaciones (precuela, secuela, etc.)
                if (data.relaciones && data.relaciones.length > 0) {
                    const relDiv = document.getElementById('lista-relaciones');
                    relDiv.innerHTML = '';
                    data.relaciones.forEach(r => {
                        const a = document.createElement('a');
                        a.className = 'relacion-tag';
                        a.href = `/anime/${r.slug}`;
                        a.textContent = `${r.typeName}: ${r.titulo}`;
                        a.addEventListener('click', () => sessionStorage.setItem('animeReferrer', window.location.href));
                        relDiv.appendChild(a);
                    });
                }
                if (data.episodios) { allEpisodes = data.episodios; renderCaps(); }

                // Update to clean URL
                if (slug) {
                    const newPath = `/anime/${slug}`;
                    if (window.location.pathname !== newPath && !params.get('slug')) {
                        history.replaceState(null, '', newPath);
                    }
                }
                // Update title/cover from API if not from params/cache
                if (!titulo || !imagenUrl) {
                    titulo = data.titulo || titulo || 'Anime';
                    imagenUrl = data.portada || data.imagen || imagenUrl || '';
                    document.getElementById('titulo-anime').innerText = titulo;
                    document.title = `${titulo} - Animelandia`;
                    document.getElementById('img-anime').src = imagenUrl;
                }

                // JSON-LD structured data for Google rich snippets
                const jsonld = {
                    "@context": "https://schema.org",
                    "@type": data.tipo === 'Película' || data.tipo === 'Movie' ? 'Movie' : 'TVSeries',
                    "name": titulo,
                    "description": (data.descripcion || '').substring(0, 500),
                    "genre": data.generos || undefined,
                    "datePublished": data.anio || undefined,
                    "numberOfEpisodes": data.episodios ? data.episodios.length : undefined,
                    "image": imagenUrl || undefined,
                    "inLanguage": "es"
                };
                const ldScript = document.createElement('script');
                ldScript.type = 'application/ld+json';
                ldScript.textContent = JSON.stringify(jsonld);
                document.head.appendChild(ldScript);
            } catch (e) { showError('Error al cargar la información del anime. Verificá que el backend esté funcionando.'); }
            document.getElementById('loading-anime').style.display = 'none';
            document.getElementById('anime-content').style.display = 'block';
        };

        function showError(msg) {
            document.getElementById('error-message').innerText = msg;
            document.getElementById('error-container').style.display = 'block';
            document.getElementById('loading-anime').style.display = 'none';
            document.getElementById('anime-content').style.display = 'none';
        }
        function hideError() {
            document.getElementById('error-container').style.display = 'none';
        }
        function reintentar() {
            hideError();
            document.getElementById('loading-anime').style.display = 'flex';
            document.getElementById('anime-content').style.display = 'none';
            window.onload();
        }
        
        function buscarYRedirigir() {
            const q = document.getElementById('input-buscador').value;
            if (q) window.location.href = `index.html?search=${encodeURIComponent(q)}`;
        }

        function volverAtras() {
            const referrer = sessionStorage.getItem('animeReferrer');
            if (referrer) {
                sessionStorage.removeItem('animeReferrer');
                window.location.href = referrer;
            } else {
                window.history.back();
            }
        }
        
        function filtrarCapitulos() {
            const val = document.getElementById('input-busca-cap').value;
            const grid = document.getElementById('grid-caps');
            const pagContainer = document.getElementById('pagination-caps');
            capsPage = 1;
            if (val === "") { renderCaps(); return; }
            const filtrados = allEpisodes.filter(ep => ep.numero.toString() === val);
            grid.innerHTML = '';
            pagContainer.innerHTML = '';
            if (filtrados.length > 0) {
                filtrados.forEach(ep => {
                    const card = document.createElement('div');
                    card.className = 'cap-card';
                    card.innerHTML = `<img src="${ep.thumbnail}" loading="lazy" onerror="this.src='${imagenUrl}'"><div class="cap-label">Episodio ${ep.numero}</div>`;
                    card.onclick = () => buscarOpciones(ep.numero);
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = '<p style="color:gray; padding:20px;">Episodio no encontrado.</p>';
            }
        }

        function getEpisodiosOrdenados() {
            return ordenAscendente ? [...allEpisodes].reverse() : allEpisodes;
        }

        function toggleOrdenCaps() {
            ordenAscendente = !ordenAscendente;
            document.getElementById('btn-orden-caps').innerText = ordenAscendente ? '⬆' : '⬇';
            document.getElementById('input-busca-cap').value = '';
            capsPage = 1;
            renderCaps();
        }

        function renderCaps() {
            const grid = document.getElementById('grid-caps');
            const pagContainer = document.getElementById('pagination-caps');
            const episodes = getEpisodiosOrdenados();
            const totalPages = Math.ceil(episodes.length / capsPerPage);
            const start = (capsPage - 1) * capsPerPage;
            const end = start + capsPerPage;
            const slice = episodes.slice(start, end);

            grid.innerHTML = '';
            slice.forEach(ep => {
                const card = document.createElement('div');
                card.className = 'cap-card';
                card.innerHTML = `<img src="${ep.thumbnail}" loading="lazy" onerror="this.src='${imagenUrl}'"><div class="cap-label">Episodio ${ep.numero}</div>`;
                card.onclick = () => buscarOpciones(ep.numero);
                grid.appendChild(card);
            });

            // Renderizar paginación con ventana deslizante
            pagContainer.innerHTML = '';
            if (totalPages > 1) {
                // Botón anterior (siempre visible)
                const prevBtn = createCapsPageLink(Math.max(1, capsPage - 1), capsPage, '<', 'prev-btn', capsPage <= 1);
                pagContainer.appendChild(prevBtn);
                
                // Ventana fija de 5 páginas que se desliza
                let startPage = Math.max(1, capsPage - 2);
                let endPage = Math.min(totalPages, startPage + 4);
                
                // Ajustar si estamos cerca del final
                if (endPage - startPage < 4) {
                    startPage = Math.max(1, endPage - 4);
                }
                
                for (let i = startPage; i <= endPage; i++) {
                    pagContainer.appendChild(createCapsPageLink(i, capsPage, i.toString()));
                }
                
                // Botón siguiente (siempre visible)
                const nextBtn = createCapsPageLink(Math.min(totalPages, capsPage + 1), capsPage, '>', 'next-btn', capsPage >= totalPages);
                pagContainer.appendChild(nextBtn);
                
                // Botón última página (siempre visible)
                const lastBtn = createCapsPageLink(totalPages, capsPage, '>>', 'last-btn', capsPage >= totalPages);
                pagContainer.appendChild(lastBtn);
            }
        }

        function createCapsPageLink(pageNum, currentPage, text, extraClass = '', disabled = false) {
            const a = document.createElement('a');
            a.innerText = text;
            if (extraClass) a.className = extraClass;
            if (disabled || pageNum === currentPage) {
                if (disabled) a.className += ' disabled';
                if (pageNum === currentPage) a.className += ' active';
                a.style.pointerEvents = 'none';
            } else {
                a.onclick = (e) => { e.preventDefault(); irACapsPage(pageNum); };
            }
            return a;
        }

        function irACapsPage(num) {
            capsPage = num;
            renderCaps();
        }

        function renderizarFavoritosDetalle() {
            const container = document.getElementById('lista-favoritos-detalle');
            container.innerHTML = '';
            if (favoritos.length === 0) { container.innerHTML = '<p style="color:gray;">No tenés animes guardados aún.</p>'; return; }
            favoritos.forEach((anime) => {
                const card = document.createElement('div');
                card.className = 'card-fav';
                card.onclick = () => { sessionStorage.setItem('animeReferrer', window.location.href); window.location.href = `/anime/${anime.slug}`; };
                card.innerHTML = `<img src="${anime.imagen}"><div class="card-fav-info"><b>${anime.titulo}</b></div>`;
                container.appendChild(card);
            });
        }

        function toggleFavAnime() {
            const btnFav = document.getElementById('btn-fav-anime');
            const favIcon = btnFav.querySelector('.favorite-icon');
            const titulo = document.getElementById('titulo-anime').innerText;
            const imagen = document.getElementById('img-anime').src;
            const idx = favoritos.findIndex(f => f.slug === slug);
            if (idx === -1) {
                favoritos.push({ slug, titulo, imagen });
                localStorage.setItem('misAnimes', JSON.stringify(favoritos));
                if (favIcon) favIcon.classList.add('active');
                renderizarFavoritosDetalle();
                showToast('✅ Agregado a favoritos');
            } else {
                favoritos.splice(idx, 1);
                localStorage.setItem('misAnimes', JSON.stringify(favoritos));
                if (favIcon) favIcon.classList.remove('active');
                renderizarFavoritosDetalle();
                showToast('❌ Eliminado de favoritos');
            }
        }

        async function buscarOpciones(cap) {
            currentCap = cap;
            const rep = document.getElementById('reproductor');
            const frame = document.getElementById('video-frame');
            const tituloViendo = document.getElementById('viendo-titulo');
            const divServidores = document.getElementById('contenedor-servidores');
            const btnPrev = document.getElementById('btn-cap-prev');
            const btnNext = document.getElementById('btn-cap-next');
            if (frame) { frame.src = ""; frame.style.display = "none"; }
            rep.style.display = 'block';
            divServidores.innerHTML = '🔍 Buscando servidores...';
            tituloViendo.innerText = `Cargando Episodio ${cap}...`;
            window.scrollTo({ top:0, behavior: 'smooth' });

            // Guardar en continuar viendo
            const continuar = JSON.parse(localStorage.getItem('continuarViendo') || '{}');
            continuar[slug] = { slug, titulo, imagen: imagenUrl, cap, timestamp: Date.now() };
            localStorage.setItem('continuarViendo', JSON.stringify(continuar));

            // Actualizar botones de navegación (allEpisodes viene descendente: cap más alto primero)
            const idx = allEpisodes.findIndex(e => e.numero === cap);
            btnPrev.disabled = idx >= allEpisodes.length - 1;
            btnNext.disabled = idx <= 0;
            btnNext.classList.toggle('highlight', !btnNext.disabled);

            try {
                const res = await fetch(withSource(`${API_URL}/get-video?slug=${slug}&cap=${cap}`));
                const data = await res.json();
                downloads = data.descargas || [];
                renderDownloadMenu();
                if (data.servidores && data.servidores.length > 0) {
                    divServidores.innerHTML = '';
                    const epName = data.episodeTitle ? ` — ${data.episodeTitle}` : '';
                    tituloViendo.innerText = `Viendo Episodio ${cap}${epName}`;
                    data.servidores.forEach((srv, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'btn-servidor';
                        btn.innerText = srv.nombre;
                        btn.onclick = () => {
                            frame.src = srv.url;
                            frame.style.display = 'block';
                            frame.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        };
                        divServidores.appendChild(btn);
                        if (index === 0) btn.click();
                    });
                } else { divServidores.innerHTML = '⚠️ No hay reproductores disponibles.'; }
            } catch (e) { tituloViendo.innerText = "❌ Error encontrando."; }
        }

        function capAnterior() {
            const idx = allEpisodes.findIndex(e => e.numero === currentCap);
            if (idx < allEpisodes.length - 1) buscarOpciones(allEpisodes[idx + 1].numero);
        }

        function capSiguiente() {
            const idx = allEpisodes.findIndex(e => e.numero === currentCap);
            if (idx > 0) buscarOpciones(allEpisodes[idx - 1].numero);
        }

        function renderDownloadMenu() {
            const wrap = document.getElementById('download-wrap');
            const menu = document.getElementById('download-menu');
            if (!downloads.length) { wrap.style.display = 'none'; return; }
            wrap.style.display = 'block';
            menu.innerHTML = '';
            downloads.forEach(d => {
                const a = document.createElement('a');
                a.href = d.url;
                a.target = '_blank';
                a.rel = 'noopener';
                a.innerText = `📥 ${d.nombre}`;
                menu.appendChild(a);
            });
        }

        function toggleDownloadMenu() {
            document.getElementById('download-menu').classList.toggle('show');
        }

        document.addEventListener('click', (e) => {
            const wrap = document.getElementById('download-wrap');
            if (wrap && !wrap.contains(e.target)) {
                document.getElementById('download-menu')?.classList.remove('show');
            }
        });

        // Keyboard shortcuts: F = fullscreen, ← → = navegación
        document.addEventListener('keydown', (e) => {
            if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
            const frame = document.getElementById('video-frame');
            if (e.key === 'f' || e.key === 'F') {
                if (frame && frame.src) {
                    e.preventDefault();
                    if (document.fullscreenElement) document.exitFullscreen();
                    else frame.requestFullscreen?.();
                }
            }
            if (e.key === 'ArrowLeft' && !document.getElementById('btn-cap-prev').disabled) capAnterior();
            if (e.key === 'ArrowRight' && !document.getElementById('btn-cap-next').disabled) capSiguiente();
        });

        // Mobile search function
        function buscarYRedirigirMobile() {
            const q = document.getElementById('input-buscador-mobile').value;
            if (q) window.location.href = `index.html?search=${encodeURIComponent(q)}`;
        }

        // HAMBURGER MENU LOGIC
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const navMenu = document.getElementById('nav-menu');

        if (hamburgerBtn && navMenu) {
            hamburgerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                navMenu.classList.toggle('active');
                hamburgerBtn.classList.toggle('active');
            });
            document.addEventListener('click', (e) => {
                if (!hamburgerBtn.contains(e.target) && !navMenu.contains(e.target)) {
                    navMenu.classList.remove('active');
                    hamburgerBtn.classList.remove('active');
                }
            });
        }

        // Toast notification
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._hide);
            t._hide = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Scroll-to-top
        document.addEventListener('scroll', () => {
            const btn = document.getElementById('scroll-top-btn');
            if (btn) btn.classList.toggle('visible', window.scrollY > 400);
        });

        // Share button
        function compartirAnime() {
            const url = window.location.href;
            const titulo = document.getElementById('titulo-anime').innerText;
            if (navigator.share) {
                navigator.share({ title: `${titulo} - Animelandia`, url });
            } else {
                navigator.clipboard.writeText(url).then(() => showToast('🔗 Link copiado al portapapeles'));
            }
        }

        // Ctrl+K / / para buscar
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey && e.key === 'k') || (!e.ctrlKey && !e.metaKey && e.key === '/' && !['INPUT','TEXTAREA'].includes(e.target.tagName))) {
                e.preventDefault();
                const input = document.getElementById('input-buscador') || document.getElementById('input-buscador-mobile');
                if (input) input.focus();
            }
        });
    </script>
    <div id="toast" class="toast"></div>
    <button id="scroll-top-btn" class="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
    <footer style="text-align:center; padding:10px; font-size:12px; color:#666; background:#1a1a1a; margin-top:20px;">
        @AlanFoaRostirolla - Animelandia 2026
    </footer>
