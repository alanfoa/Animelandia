    <style>
        input[type="text"] { width: 400px; }

        .search-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
        }
        .search-dropdown.active { display: block; }
        .search-dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            text-decoration: none;
            color: var(--text-color);
            transition: background 0.15s;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .search-dropdown-item:last-child { border-bottom: none; }
        .search-dropdown-item:hover { background: var(--racing-celeste); color: white; }
        .search-dropdown-item img { width: 40px; height: 56px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        .search-dropdown-item span { font-weight: 600; font-size: 13px; }
        .search-dropdown-empty { padding: 14px; text-align: center; color: #999; font-size: 13px; }

        /* CAROUSEL STYLES */
        .carousel-container {
            position: relative;
            width: 100vw;
            left: 50%;
            transform: translateX(-50%);
            overflow: hidden;
            border-radius: 0;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-slide {
            min-width: 100%;
            position: relative;
            height: 450px;
            cursor: pointer;
        }

        .carousel-slide .carousel-backdrop {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4);
        }

        [data-theme="light"] .carousel-slide .carousel-backdrop {
            filter: brightness(0.6);
        }

        .carousel-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 65px;
            z-index: 5;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .carousel-content h2 {
            color: #fff;
            font-size: 32px;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .carousel-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            color: #ccc;
        }

        .carousel-meta span {
            background: rgba(255,255,255,0.15);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .carousel-meta .status-airing {
            background: rgba(0, 174, 239, 0.3);
            color: #00AEEF;
        }

        .carousel-synopsis {
            color: #ddd;
            font-size: 14px;
            line-height: 1.5;
            max-width: 600px;
            max-height: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .carousel-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 24px;
            background: var(--racing-celeste);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .carousel-btn:hover {
            opacity: 0.85;
            transform: scale(1.03);
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .carousel-nav:hover {
            background: var(--racing-celeste);
        }

        .carousel-prev { left: 15px; }
        .carousel-next { right: 15px; }

        .carousel-indicators {
            position: absolute;
            bottom: 15px;
            right: 40px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .carousel-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            border: none;
            cursor: pointer;
            transition: 0.2s;
            padding: 0;
        }

        .carousel-indicator.active {
            background: var(--racing-celeste);
            transform: scale(1.3);
        }

        @media (max-width: 768px) {
            .carousel-slide {
                height: 300px;
            }

            .carousel-content {
                padding: 20px 55px;
            }

            .carousel-content h2 {
                font-size: 22px;
            }

            .carousel-synopsis {
                font-size: 12px;
                max-height: 55px;
            }

            .carousel-nav {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }

            .carousel-prev { left: 8px; }
            .carousel-next { right: 8px; }

            .carousel-indicators {
                right: 20px;
                bottom: 10px;
            }
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            padding: 20px 50px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
            cursor: pointer;
            animation: fadeIn 0.3s ease forwards;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0, 174, 239, 0.3);
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #000;
        }

        .ep-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--racing-celeste);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            z-index: 5;
            text-transform: uppercase;
        }

        .card-info {
            padding: 15px;
            text-align: center;
            background: var(--card-bg);
            color: var(--text-color);
            position: relative;
            z-index: 10;
            font-size: 14px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            header img {
                height: 80px;
            }

            .btn-mode {
                right: 10px;
                width: 35px;
                height: 35px;
                font-size: 16px;
            }

            .search-box {
                flex-direction: column;
                padding: 15px;
                gap: 8px;
            }

            input[type="text"] {
                width: 90%;
            }

            .btn-nav {
                width: 100%;
            }

            .container {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                padding: 15px;
            }

            .carousel-container {
                margin: 0 10px;
            }
        }

    </style>
</head>

<body>
    <nav class="navbar">
        <!-- LEFT: Logo + Search (Desktop) -->
        <div class="nav-left">

            <div class="nav-search nav-search-desktop" style="position:relative;">

        <!-- Hamburger Button (Mobile) -->

                </td>

            <button class="btn-nav" onclick="window.location.href='explorar.html'">CATALOGO</button>
            <button class="btn-nav" onclick="document.getElementById('seccion-favoritos').scrollIntoView();">
                <svg class="favorite-icon active" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg" style="width:16px;height:24px;vertical-align:middle;">

    <div class="carousel-container" id="carousel">
        <div class="carousel-track" id="carousel-track"></div>
        <button class="carousel-nav carousel-prev" onclick="moveCarousel(-1)" aria-label="Anterior slide">&#10094;</button>
        <button class="carousel-nav carousel-next" onclick="moveCarousel(1)" aria-label="Siguiente slide">&#10095;</button>
        <div class="carousel-indicators" id="carousel-indicators"></div>
    </div>

    <div id="btn-volver" style="padding: 20px 50px 0; display: none;">
        <button class="btn-nav" onclick="volverInicio()">← VOLVER AL INICIO</button>
    </div>
    <div id="continuar-viendo-section" style="display:none;">
        <h2 style="padding: 20px 50px 0; color: var(--racing-celeste);">Continuar Viendo</h2>
        <div id="continuar-viendo-grid" class="container"></div>
    </div>
    <h2 id="titulo-seccion" style="padding: 20px 50px 0; color: var(--racing-celeste);">Ultimos Estrenos:</h2>
        <div id="error-container" class="error-container" role="alert">
            <p id="error-message"></p>
            <button class="btn-nav" onclick="reintentar()">REINTENTAR</button>
        </div>
    <div id="ultimos-lanzamientos" class="container"><div class="loading-spinner"><img src="assets/img/Sharingam.png" alt="Cargando..."></div><div class="skeleton-grid" id="skeleton-grid" style="display:none;"></div></div>

    <h2 id="seccion-favoritos" style="padding: 20px 50px 0; color: var(--racing-celeste);">
        Favoritos
        <svg class="favorite-icon active" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg" style="width:20px;height:30px;vertical-align:middle;margin-left:6px;">
            <path class="marker" d="M5,2 L19,2 Q22,2 22,5 L22,28 L12,34 L2,28 L2,5 Q2,2 5,2 Z" />
            <path class="star" d="M12,10 L14,13 L18,14 L15,16 L16,20 L12,18 L8,20 L9,16 L6,14 L10,13 Z" />
        </svg>
    </h2>
    <div id="miLista" class="container"></div>

    <script>
        // API URL: usa localhost en desarrollo, Render en producción
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3001' : 'https://animelandia-api-6wp2.onrender.com';
        const isLocal = API_URL.startsWith('http://localhost');

        function getSource() { return localStorage.getItem('animeSource') || 'av1'; }
        function withSource(url) { return getSource() === 'tio' ? url + (url.includes('?') ? '&' : '?') + 'source=tio' : url; }
        function toggleSource() {
            const next = getSource() === 'av1' ? 'tio' : 'av1';
            localStorage.setItem('animeSource', next);
            location.reload();
        }
        function updateSourceToggle() {
            const src = getSource();
            const circle = document.getElementById('source-circle');
            const icon = document.getElementById('source-icon');
            if (src === 'tio') {
                circle.style.left = 'calc(100% - 30px)';
                icon.src = 'https://tioanime.com/assets/img/icon-32x32.png';
            } else {
                circle.style.left = '4px';
                icon.src = 'https://animeav1.com/favicon.png';
            }
        }
        updateSourceToggle();

        const listaDiv = document.getElementById('miLista');
        let favoritos = JSON.parse(localStorage.getItem('misAnimes')) || [];

        // CAROUSEL STATE - HARDCODED FOR RELIABILITY
        let carouselIndex = 0;
        let carouselInterval;

        const carouselData = [
            {
                titulo: "Gintama",
                slug: "gintama-season-5",
                id: "202",
                backdrop: "https://4kwallpapers.com/images/wallpapers/gintama-ultrawide-4400x2160-16169.jpg",
                tipo: "TV Anime",
                anio: "2017",
                status: 2,
                synopsis: "La historia sigue a Gintoki Sakata, un samurái excéntrico que vive en una versión alternativa de Edo donde los alienígenas han invadido. Trabaja como freelancer junto a Shimura Shinpachi y Kagura.",
                generos: ["Comedia", "Acción", "Ciencia Ficción"]
            },
            {
                titulo: "Naruto",
                slug: "naruto",
                id: "190",
                backdrop: "https://imgsrv.crunchyroll.com/cdn-cgi/image/fit=cover,format=auto,quality=85,width=1920/keyart/GY9PJ5KWR-backdrop_wide",
                tipo: "TV Anime",
                anio: "2002",
                status: 2,
                synopsis: "Naruto Uzumaki es un joven ninja que busca reconocimiento y sueña con convertirse en el Hokage, el líder de su aldea. Posee al Zorro de Nueve Colas, un poderoso demonio sellado en su interior.",
                generos: ["Acción", "Aventura", "Shounen"]
            },
            {
                titulo: "One Piece",
                slug: "one-piece",
                id: "197",
                backdrop: "https://4kwallpapers.com/images/wallpapers/one-piece-character-3840x2160-15328.jpeg",
                tipo: "TV Anime",
                anio: "1999",
                status: 0,
                synopsis: "Monkey D. Luffy, un joven que accidentalmente adquirió poderes de goma tras comer una Fruta del Diablo, se embarca en una aventura para encontrar el tesoro más grande del mundo: el One Piece.",
                generos: ["Acción", "Aventura", "Fantasía", "Shounen"]
            },
            {
                titulo: "Chainsaw Man",
                slug: "chainsaw-man",
                id: "1072",
                backdrop: "https://images.wallpapersden.com/image/download/anime-chainsaw-man-denji-4k-art_bWxubG6UmZqaraWkpJRobWxnrWZuZ20.jpg",
                tipo: "TV Anime",
                anio: "2022",
                status: 2,
                synopsis: "Denji es un joven pobre que trabaja para la Yakuza cazando demonios junto a su compañero Pochita. Tras ser traicionado y asesinado, renace gracias al sacrificio de Pochita uniéndose en uno solo.",
                generos: ["Acción", "Horror", "Shounen"]
            }
        ];

        function moveCarousel(direction) {
            carouselIndex = (carouselIndex + direction + carouselData.length) % carouselData.length;
            updateCarousel();
            resetCarouselTimer();
        }

        function goToSlide(index) {
            carouselIndex = index;
            updateCarousel();
            resetCarouselTimer();
        }

        function updateCarousel() {
            const track = document.getElementById('carousel-track');
            track.style.transform = `translateX(-${carouselIndex * 100}%)`;

            document.querySelectorAll('.carousel-indicator').forEach((dot, i) => {
                dot.classList.toggle('active', i === carouselIndex);
            });
        }

        function resetCarouselTimer() {
            clearInterval(carouselInterval);
            carouselInterval = setInterval(() => moveCarousel(1), 6000);
        }

        function renderCarousel() {
            const track = document.getElementById('carousel-track');
            const indicators = document.getElementById('carousel-indicators');

            track.innerHTML = carouselData.map((anime, index) => {
                const statusText = anime.status === 0 ? 'En emisión' : anime.status === 2 ? 'Finalizado' : 'Próximamente';
                const statusClass = anime.status === 0 ? 'status-airing' : '';
                const synopsis = anime.synopsis.length > 200 ? anime.synopsis.substring(0, 200) + '...' : anime.synopsis;
                const href = `/anime/${anime.slug}`;

                return `
                <a class="carousel-slide" href="${href}" data-index="${index}" style="display:block; text-decoration:none; color:inherit;">
                    <img class="carousel-backdrop" src="${anime.backdrop}" loading="lazy" alt="${anime.titulo} Backdrop"
                         onerror="this.src='https://via.placeholder.com/1280x720?text=Animelandia'">
                    <div class="carousel-content">
                        <h2>${anime.titulo}</h2>
                        <div class="carousel-meta">
                            <span>${anime.tipo}</span>
                            <span>${anime.anio}</span>
                            <span class="${statusClass}">${statusText}</span>
                            ${anime.generos.map(g => `<span>${g}</span>`).join('')}
                        </div>
                        <p class="carousel-synopsis">${synopsis}</p>
                        <button class="carousel-btn" data-index="${index}">Ver Anime</button>
                    </div>
                </a>`;
            }).join('');

            indicators.innerHTML = carouselData.map((_, i) => 
                `<button class="carousel-indicator ${i === 0 ? 'active' : ''}" data-index="${i}"></button>`
            ).join('');

            track.querySelectorAll('.carousel-slide').forEach(slide => {
                slide.addEventListener('click', () => sessionStorage.setItem('animeReferrer', window.location.href));
            });

            track.querySelectorAll('.carousel-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
            });

            indicators.querySelectorAll('.carousel-indicator').forEach(dot => {
                dot.addEventListener('click', () => {
                    const idx = parseInt(dot.dataset.index);
                    goToSlide(idx);
                });
            });
        }

        // LÓGICA MODO OSCURO (NUEVO) - Default: Dark mode
        function toggleTheme() {
            const html = document.documentElement;
            const toggleCircle = document.getElementById('toggle-circle');
            
            if (html.getAttribute('data-theme') === 'dark') {
                // Cambiar a modo claro
                html.removeAttribute('data-theme');
                toggleCircle.style.left = '4px';
                toggleCircle.innerHTML = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                // Cambiar a modo oscuro
                html.setAttribute('data-theme', 'dark');
                toggleCircle.style.left = 'calc(100% - 30px)';
                toggleCircle.innerHTML = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        // APLICAR TEMA GUARDADO AL CARGAR - Default is dark
        if (localStorage.getItem('theme') === 'light') {
            // Modo claro: sol a la izquierda
            document.documentElement.removeAttribute('data-theme');
            document.getElementById('toggle-circle').style.left = '4px';
            document.getElementById('toggle-circle').innerHTML = '☀️';
        } else {
            // Default to dark mode: luna a la derecha
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('toggle-circle').style.left = 'calc(100% - 30px)';
            document.getElementById('toggle-circle').innerHTML = '🌙';
        }

        renderizarContinuarViendo();
        renderizarLista();

        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const searchQuery = params.get('search');
            if (searchQuery) {
                document.getElementById('input-buscador').value = searchQuery;
                buscarAnime();
            } else {
                renderCarousel();
                resetCarouselTimer();
                await cargarEstrenos();
            }
        };

        function showError(msg) {
            document.getElementById('error-message').innerText = msg;
            document.getElementById('error-container').style.display = 'block';
            document.getElementById('ultimos-lanzamientos').innerHTML = '';
        }
        function hideError() {
            document.getElementById('error-container').style.display = 'none';
        }
        function reintentar() {
            hideError();
            cargarEstrenos();
        }

        async function cargarEstrenos() {
            const container = document.getElementById('ultimos-lanzamientos');
            container.innerHTML = '<div class="loading-spinner"><img src="assets/img/Sharingam.png" alt="Cargando..."></div><div class="skeleton-grid" id="skeleton-grid">' + Array(12).fill('<div class="skeleton skeleton-card"></div>').join('') + '</div>';
            try {
                const res = await fetch(withSource(`${API_URL}/latest`));
                const data = await res.json();
                renderizarEstrenos(data);
            } catch (e) { showError('Error de conexión. Verificá que el backend esté funcionando.'); }
        }

        function renderizarEstrenos(episodios) {
            const container = document.getElementById('ultimos-lanzamientos');
            container.innerHTML = '';
            episodios.forEach(ep => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = `/anime/${ep.slug}`;
                card.style.textDecoration = 'none';
                card.style.color = 'inherit';

                // AGREGAMOS ESTA LÓGICA: Solo crea el HTML del tag si ep.cap tiene valor
                const tagCap = ep.cap ? `<div class="ep-tag">${ep.cap}</div>` : '';

                card.innerHTML = `
            ${tagCap} 
            <button class="btn-fav">
                <svg class="favorite-icon" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
                    <path class="marker" d="M5,2 L19,2 Q22,2 22,5 L22,28 L12,34 L2,28 L2,5 Q2,2 5,2 Z" />
                    <path class="star" d="M12,10 L14,13 L18,14 L15,16 L16,20 L12,18 L8,20 L9,16 L6,14 L10,13 Z" />
                </svg>
            </button>
            <img src="${ep.imagen}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x280?text=Sin+Imagen'">
            <div class="card-info"><b>${ep.titulo}</b></div>`;

                const favBtn = card.querySelector('.btn-fav');
                const favIcon = favBtn.querySelector('.favorite-icon');
                if (favoritos.some(f => f.slug === ep.slug)) {
                    if (favIcon) favIcon.classList.add('active');
                }
                favBtn.onclick = (e) => { e.stopPropagation(); e.preventDefault(); guardar(ep, favBtn); };
                card.addEventListener('click', () => sessionStorage.setItem('animeReferrer', window.location.href));
                container.appendChild(card);
            });
        }

        function volverInicio() {
            document.getElementById('carousel').style.display = '';
            document.getElementById('input-buscador').value = '';
            document.getElementById('titulo-seccion').innerText = 'Ultimos Estrenos:';
            document.getElementById('btn-volver').style.display = 'none';
            renderizarContinuarViendo();
            cargarEstrenos();
        }

        async function buscarAnime() {
            const query = document.getElementById('input-buscador').value.trim();
            if (!query) return;
            document.getElementById('search-dropdown').classList.remove('active');
            document.getElementById('carousel').style.display = 'none';
            document.getElementById('continuar-viendo-section').style.display = 'none';
            document.getElementById('btn-volver').style.display = 'inline-block';
            const container = document.getElementById('ultimos-lanzamientos');
            container.innerHTML = '<div class="loading-spinner"><img src="assets/img/Sharingam.png" alt="Buscando..."></div>';
            document.getElementById('titulo-seccion').innerText = `Resultados para: ${query}`;
            try {
                const res = await fetch(withSource(`${API_URL}/search?q=${query}`));
                const data = await res.json();
                // Manejar tanto formato nuevo { results, pagination } como antiguo []
                const episodios = data.results || data;
                renderizarEstrenos(episodios);
            } catch (e) { showError('Error en la búsqueda. Verificá que el backend esté funcionando.'); }
        }

        function irADetalle(slug, titulo, imagen) {
            window.location.href = `/anime/${slug}`;
        }

        function eliminarContinuarViendo(slug, event) {
            event.preventDefault();
            event.stopPropagation();
            const data = JSON.parse(localStorage.getItem('continuarViendo') || '{}');
            delete data[slug];
            localStorage.setItem('continuarViendo', JSON.stringify(data));
            renderizarContinuarViendo();
        }

        function renderizarContinuarViendo() {
            const data = JSON.parse(localStorage.getItem('continuarViendo') || '{}');
            const entries = Object.values(data).filter(e => e.slug && e.cap).sort((a, b) => b.timestamp - a.timestamp).slice(0, 6);
            const section = document.getElementById('continuar-viendo-section');
            const grid = document.getElementById('continuar-viendo-grid');
            if (!entries.length) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            grid.innerHTML = '';
            entries.forEach(item => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = `/anime/${item.slug}`;
                card.style.textDecoration = 'none';
                card.style.color = 'inherit';
                card.innerHTML = `
                    <div class="ep-tag">Ep. ${item.cap}</div>
                    <button class="btn-delete-cv" onclick="eliminarContinuarViendo('${item.slug}', event)" aria-label="Eliminar de continuar viendo">🗑️</button>
                    <img src="${item.imagen}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x280?text=Sin+Imagen'">
                    <div class="card-info"><b>${item.titulo}</b></div>`;
                card.addEventListener('click', () => sessionStorage.setItem('animeReferrer', window.location.href));
                grid.appendChild(card);
            });
        }

        function renderizarLista() {
            listaDiv.innerHTML = '';
            favoritos.forEach((anime, i) => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = `/anime/${anime.slug}`;
                card.style.textDecoration = 'none';
                card.style.color = 'inherit';
                card.innerHTML = `
                    <button class="btn-fav btn-fav-active" style="position:absolute; top:10px; right:10px; z-index:30;" onclick="event.stopPropagation(); event.preventDefault(); borrar(${i})">
                        <svg class="favorite-icon active" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
                            <path class="marker" d="M5,2 L19,2 Q22,2 22,5 L22,28 L12,34 L2,28 L2,5 Q2,2 5,2 Z" />
                            <path class="star" d="M12,10 L14,13 L18,14 L15,16 L16,20 L12,18 L8,20 L9,16 L6,14 L10,13 Z" />
                        </svg>
                    </button>
                    <img src="${anime.imagen}"><div class="card-info"><b>${anime.titulo}</b></div>`;
                card.addEventListener('click', () => sessionStorage.setItem('animeReferrer', window.location.href));
                listaDiv.appendChild(card);
            });
        }

        function guardar(obj, btnElement) {
            const idx = favoritos.findIndex(f => f.slug === obj.slug);
            const icon = btnElement ? btnElement.querySelector('.favorite-icon') : null;
            
            if (idx === -1) {
                favoritos.push(obj);
                localStorage.setItem('misAnimes', JSON.stringify(favoritos));
                if (icon) icon.classList.add('active');
                showToast('✅ Agregado a favoritos');
            } else {
                favoritos.splice(idx, 1);
                localStorage.setItem('misAnimes', JSON.stringify(favoritos));
                if (icon) icon.classList.remove('active');
                showToast('❌ Eliminado de favoritos');
            }
            renderizarLista();
        }

        function borrar(i) { favoritos.splice(i, 1); localStorage.setItem('misAnimes', JSON.stringify(favoritos)); renderizarLista(); showToast('❌ Eliminado de favoritos'); }

        // Mobile search function
        function buscarAnimeMobile() {
            const q = document.getElementById('input-buscador-mobile').value;
            if (q) window.location.href = `index.html?search=${encodeURIComponent(q)}`;
        }

        // HAMBURGER MENU LOGIC
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const navMenu = document.getElementById('nav-menu');

        if (hamburgerBtn && navMenu) {
            hamburgerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                navMenu.classList.toggle('active');
                hamburgerBtn.classList.toggle('active');
            });
            document.addEventListener('click', (e) => {
                if (!hamburgerBtn.contains(e.target) && !navMenu.contains(e.target)) {
                    navMenu.classList.remove('active');
                    hamburgerBtn.classList.remove('active');
                }
            });
        }

        // Toast notification
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._hide);
            t._hide = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Scroll-to-top
        document.addEventListener('scroll', () => {
            const btn = document.getElementById('scroll-top-btn');
            btn.classList.toggle('visible', window.scrollY > 400);
        });

        // Ctrl+K / / para buscar
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey && e.key === 'k') || (!e.ctrlKey && !e.metaKey && e.key === '/' && !['INPUT','TEXTAREA'].includes(e.target.tagName))) {
                e.preventDefault();
                const input = document.getElementById('input-buscador') || document.getElementById('input-buscador-mobile');
                if (input) input.focus();
            }
        });

        // LIVE SEARCH AUTOCOMPLETE
        let searchDebounceTimer = null;
        let lastSearchQuery = '';

        function onSearchInput(value) {
            clearTimeout(searchDebounceTimer);
            const dropdown = document.getElementById('search-dropdown');
            if (!value.trim()) { dropdown.classList.remove('active'); lastSearchQuery = ''; return; }
            searchDebounceTimer = setTimeout(() => fetchSearchSuggestions(value.trim()), 300);
        }

        async function fetchSearchSuggestions(query) {
            if (query === lastSearchQuery) return;
            lastSearchQuery = query;
            const dropdown = document.getElementById('search-dropdown');
            dropdown.innerHTML = '<div class="search-dropdown-empty">Buscando...</div>';
            dropdown.classList.add('active');
            try {
                const res = await fetch(withSource(`${API_URL}/search?q=${encodeURIComponent(query)}`));
                const data = await res.json();
                const results = (data.results || []).slice(0, 8);
                if (!results.length) { dropdown.innerHTML = '<div class="search-dropdown-empty">Sin resultados</div>'; return; }
                dropdown.innerHTML = results.map(r => `
                    <a class="search-dropdown-item" href="/anime/${r.slug}" onclick="sessionStorage.setItem('animeReferrer', window.location.href)">
                        <img src="${r.imagen || ''}" onerror="this.src='https://via.placeholder.com/40x56?text=NA'" alt="">
                        <span>${r.titulo}</span>
                    </a>
                `).join('');
            } catch (e) { dropdown.innerHTML = '<div class="search-dropdown-empty">Error de conexión</div>'; }
        }

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('search-dropdown');
            const searchArea = document.querySelector('.nav-search-desktop');
            if (dropdown && searchArea && !searchArea.contains(e.target)) dropdown.classList.remove('active');
        });
    </script>
    <div id="toast" class="toast"></div>
    <button id="scroll-top-btn" class="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
    <footer style="text-align:center; padding:10px; font-size:12px; color:#666; background:#1a1a1a; margin-top:20px;">
        @AlanFoaRostirolla - Animelandia 2026
    </footer>
</body>

</html>
