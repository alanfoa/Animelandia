    <style>
        :root {
            --panel-bg: #ffffff;
            --label-color: #555;
        }

        [data-theme="dark"] {
            --panel-bg: #1e1e1e;
            --label-color: #aaa;
        }

        .search-box {
            background: var(--box-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
            background: var(--card-bg);
            color: var(--text-color);
        }

        input[type="text"] {
            width: 400px;
        }

        .btn-main {
            padding: 12px 25px;
            cursor: pointer;
            background: var(--racing-celeste);
            color: white;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-inicio {
            background: #6c757d;
        }

        .btn-catalogo {
            background: #0056b3;
        }

        .btn-fav-nav {
            background: #ffc107;
            color: #000;
        }

        .btn-main:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .filter-panel {
            background: var(--panel-bg);
            padding: 25px;
            margin: 20px auto;
            max-width: 1100px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            color: var(--text-color);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-weight: bold;
            color: var(--label-color);
            font-size: 14px;
        }

        .btn-search-adv {
            grid-column: 1 / -1;
            background: var(--racing-celeste);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: 0.2s;
        }

        .results-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            animation: fadeIn 0.3s ease forwards;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0, 174, 239, 0.3);
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #000;
        }

        .card-year {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--racing-celeste);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .card-info {
            padding: 15px;
            text-align: center;
            background: var(--card-bg);
            color: var(--text-color);
            font-weight: bold;
            font-size: 13px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
        }

        /* Paginación profesional */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 30px 20px;
        }

        .pagination-container a,
        .pagination-container span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .pagination-container a {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #ddd;
        }

        .pagination-container a:hover {
            background: var(--racing-celeste);
            color: white;
            border-color: var(--racing-celeste);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 174, 239, 0.3);
        }

        .pagination-container a.active {
            background: var(--racing-celeste);
            color: white;
            border-color: var(--racing-celeste);
            pointer-events: none;
        }

        .pagination-container a.disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: default;
        }

        .pagination-container span {
            color: var(--text-color);
            opacity: 0.5;
        }

        .pagination-container a.prev-btn,
        .pagination-container a.next-btn,
        .pagination-container a.last-btn {
            font-weight: bold;
            min-width: 50px;
        }

        /* RESPONSIVE MÓVIL */
        @media (max-width: 768px) {
            .pagination-container {
                gap: 4px;
                padding: 20px 10px;
            }
            
            .pagination-container a,
            .pagination-container span {
                min-width: 35px;
                height: 35px;
                font-size: 12px;
                padding: 0 8px;
            }
        }

        /* RESPONSIVE MÓVIL */
        @media (max-width: 768px) {
            header img {
                height: 70px;
            }

            .btn-mode {
                right: 10px;
                width: 35px;
                height: 35px;
                font-size: 16px;
            }

            .search-box {
                flex-direction: column;
                padding: 15px;
                gap: 10px;
            }

            input[type="text"] {
                width: 95%;
            }

            .btn-main {
                width: 100%;
            }

            .filter-panel {
                margin: 10px;
                padding: 15px;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .results-container {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                padding: 10px;
                gap: 15px;
            }

            .card img {
                height: 200px;
            }
        }

    </style>
</head>

    <script>
        // API URL: usa localhost en desarrollo, Render en producción
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:3001' : 'https://animelandia-api-6wp2.onrender.com';
        const isLocal = API_URL.startsWith('http://localhost');

        // Modo Nocturno
        // LÓGICA MODO OSCURO
        function toggleTheme() {
            const html = document.documentElement;
            const toggleCircle = document.getElementById('toggle-circle');
            
            if (html.getAttribute('data-theme') === 'dark') {
                // Cambiar a modo claro
                html.removeAttribute('data-theme');
                toggleCircle.style.left = '4px';
                toggleCircle.innerHTML = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                // Cambiar a modo oscuro
                html.setAttribute('data-theme', 'dark');
                toggleCircle.style.left = 'calc(100% - 30px)';
                toggleCircle.innerHTML = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        // CARGAR TEMA GUARDADO AL INICIAR
        if (localStorage.getItem('theme') === 'light') {
            // Modo claro: sol a la izquierda
            document.documentElement.removeAttribute('data-theme');
            document.getElementById('toggle-circle').style.left = '4px';
            document.getElementById('toggle-circle').innerHTML = '☀️';
        } else {
            // Default to dark mode: luna a la derecha
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('toggle-circle').style.left = 'calc(100% - 30px)';
            document.getElementById('toggle-circle').innerHTML = '🌙';
        }

        // Generador de años
        const yearSelect = document.getElementById('f-year');
        for (let y = 2026; y >= 1990; y--) {
            let opt = document.createElement('option');
            opt.value = y;
            opt.innerText = y;
            yearSelect.appendChild(opt);
        }

        let currentQuery = "";
        let paginaCargar = 1;
        let prefetchCache = {};

        // Función para la barra de búsqueda superior (igual que en index)
        function buscarYRedirigir() {
            const q = document.getElementById('input-buscador').value;
            if (q) window.location.href = `index.html?search=${encodeURIComponent(q)}`;
        }

        function obtenerFiltros() {
            const params = new URLSearchParams();
            const y = document.getElementById('f-year').value;
            const g = document.getElementById('f-genero').value;
            const t = document.getElementById('f-tipo').value;
            const e = document.getElementById('f-estado').value;
            const o = document.getElementById('f-orden').value;
            const l = document.getElementById('f-letra').value;

            if (y) {
                params.append('minYear', y);
                params.append('maxYear', y);
            }
            if (g) params.append('genre', g);
            if (t) params.append('category', t);
            if (e) params.append('status', e);
            if (o) params.append('order', o);
            if (l) params.append('letter', l);

            // Persistir en URL
            const qs = params.toString();
            const newUrl = qs ? `?${qs}` : window.location.pathname;
            history.replaceState(null, '', newUrl);

            return qs;
        }

        // Cargar filtros desde URL al iniciar
        function cargarFiltrosDeURL() {
            const params = new URLSearchParams(window.location.search);
            const map = { 'minYear': 'f-year', 'genre': 'f-genero', 'category': 'f-tipo', 'status': 'f-estado', 'order': 'f-orden', 'letter': 'f-letra' };
            for (const [key, val] of params) {
                const elId = map[key];
                if (elId) {
                    const el = document.getElementById(elId);
                    if (el) el.value = val;
                }
            }
        }

        async function ejecutarFiltro() {
            const container = document.getElementById('resultados');
            const paginationContainer = document.getElementById('pagination');

            container.innerHTML = '<div class="loading-spinner"><img src="assets/img/Sharingam.png" alt="Buscando..."></div><div class="skeleton-grid">' + Array(12).fill('<div class="skeleton skeleton-card"></div>').join('') + '</div>';
            if (paginationContainer) paginationContainer.innerHTML = '';
            paginaCargar = 1;

            currentQuery = obtenerFiltros();
            await buscarPagina(paginaCargar, true);
        }

        function showError(msg) {
            document.getElementById('error-message').innerText = msg;
            document.getElementById('error-container').style.display = 'block';
            document.getElementById('resultados').innerHTML = '';
            document.getElementById('pagination').innerHTML = '';
        }
        function hideError() {
            document.getElementById('error-container').style.display = 'none';
        }
        function reintentar() {
            hideError();
            ejecutarFiltro();
        }

        async function buscarPagina(num, esNuevaBusqueda) {
            const container = document.getElementById('resultados');
            const paginationContainer = document.getElementById('pagination');

            // Limpiar paginación siempre
            if (paginationContainer) paginationContainer.innerHTML = '';

            if (prefetchCache[num]) {
                const data = prefetchCache[num];
                delete prefetchCache[num];
                const nuevosAnimes = data.results || [];
                const pagination = data.pagination || { currentPage: num, totalPages: (nuevosAnimes.length >= 20 ? num + 1 : num), totalRecords: nuevosAnimes.length };
                container.innerHTML = '';
                renderizarResultados(nuevosAnimes, pagination, container, paginationContainer);
                return;
            }

            try {
                const params = new URLSearchParams();
                params.append('page', num);

                if (currentQuery) {
                    const filtros = new URLSearchParams(currentQuery);
                    for (const [key, value] of filtros) {
                        params.append(key, value);
                    }
                }

                const url = API_URL + '/search?' + params.toString();
                const res = await fetch(url);
                const data = await res.json();

                const nuevosAnimes = data.results || [];
                const pagination = data.pagination || { currentPage: num, totalPages: (nuevosAnimes.length >= 20 ? num + 1 : num), totalRecords: nuevosAnimes.length };

                container.innerHTML = '';
                renderizarResultados(nuevosAnimes, pagination, container, paginationContainer);

            } catch (e) {
                console.error(e);
                showError('Error al cargar los resultados. Verificá que el backend esté funcionando.');
            }
        }

        function renderizarResultados(nuevosAnimes, pagination, container, paginationContainer) {
            if (!nuevosAnimes || nuevosAnimes.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">No hay resultados.</p>';
                return;
            }

            nuevosAnimes.forEach(anime => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = `/anime/${anime.slug}`;
                card.style.textDecoration = 'none';
                card.style.color = 'inherit';

                card.innerHTML = `
        ${anime.anio ? `<div class="card-year">${anime.anio}</div>` : ''}
        <button class="btn-fav" data-slug="${anime.slug}" onclick="event.stopPropagation(); event.preventDefault(); toggleFavDesdeExplorar(this, '${anime.slug}', '${anime.titulo}', '${anime.imagen}')">
            <svg class="favorite-icon" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
                <path class="marker" d="M5,2 L19,2 Q22,2 22,5 L22,28 L12,34 L2,28 L2,5 Q2,2 5,2 Z" />
                <path class="star" d="M12,10 L14,13 L18,14 L15,16 L16,20 L12,18 L8,20 L9,16 L6,14 L10,13 Z" />
            </svg>
        </button>
        <img src="${anime.imagen}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x280?text=Sin+Imagen'">
        <div class="card-info"><b>${anime.titulo}</b></div>
    `;
                if (favoritos.some(f => f.slug === anime.slug)) {
                    const favIcon = card.querySelector('.favorite-icon');
                    if (favIcon) favIcon.classList.add('active');
                }
                container.appendChild(card);
            });

            if (pagination.totalPages > 1) {
                renderPagination(pagination);
            }
        }

        function renderPagination(pagination) {
            const container = document.getElementById('pagination');
            const { currentPage, totalPages } = pagination;
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            
            // Lógica de paginación: mostrar <, 1, 2, 3, 4, 5, 6, 7, ..., totalPages, >, >>
            // Botón "<" (anterior) - siempre visible
            html += createPageLink(Math.max(1, currentPage - 1), currentPage, '<', 'prev-btn', currentPage <= 1);
            
            // Siempre mostrar primera página
            html += createPageLink(1, currentPage, '1');
            
            // Determinar rango de páginas a mostrar alrededor de la actual
            let startPage = Math.max(2, currentPage - 3);
            let endPage = Math.min(totalPages - 1, currentPage + 3);
            
            // Si hay brecha después de la página 1, mostrar "..."
            if (startPage > 2) {
                html += '<span>...</span>';
            }
            
            // Mostrar páginas del rango
            for (let i = startPage; i <= endPage; i++) {
                html += createPageLink(i, currentPage, i.toString());
            }
            
            // Si hay brecha antes de la última página, mostrar "..."
            if (endPage < totalPages - 1) {
                html += '<span>...</span>';
            }
            
            // Siempre mostrar última página (si es diferente de la primera)
            if (totalPages > 1) {
                html += createPageLink(totalPages, currentPage, totalPages.toString());
            }
            
            // Botón ">" (siguiente) - siempre visible
            html += createPageLink(Math.min(totalPages, currentPage + 1), currentPage, '>', 'next-btn', currentPage >= totalPages);
            
            // Botón ">>" (última) - siempre visible
            html += createPageLink(totalPages, currentPage, '>>', 'last-btn', currentPage >= totalPages);
            
            container.innerHTML = html;
        }

        function createPageLink(pageNum, currentPage, text, extraClass = '', disabled = false) {
            if (disabled || pageNum === currentPage) {
                let cls = disabled ? 'disabled ' : 'active ';
                return '<a class="' + cls + extraClass + '">' + text + '</a>';
            }
            return '<a href="#" onclick="irAPagina(' + pageNum + '); return false;" onmouseenter="prefetchPagina(' + pageNum + ')" class="' + extraClass + '">' + text + '</a>';
        }

        function prefetchPagina(num) {
            if (prefetchCache[num]) return;
            const params = new URLSearchParams();
            params.append('page', num);
            if (currentQuery) {
                const filtros = new URLSearchParams(currentQuery);
                for (const [key, value] of filtros) {
                    params.append(key, value);
                }
            }
            fetch(API_URL + '/search?' + params.toString())
                .then(res => res.json())
                .then(data => { prefetchCache[num] = data; })
                .catch(() => {});
        }

        function irAPagina(num) {
            paginaCargar = num;
            buscarPagina(num);
            document.getElementById('resultados').scrollIntoView({ behavior: 'smooth' });
        }

        // LOGICA DE FAVORITOS
        let favoritos = JSON.parse(localStorage.getItem('misAnimes')) || [];

        function toggleFavDesdeExplorar(btn, slug, titulo, imagen) {
            const existe = favoritos.some(f => f.slug === slug);
            const favIcon = btn.querySelector('.favorite-icon');
            if (!existe) {
                favoritos.push({ slug, titulo, imagen });
                localStorage.setItem('misAnimes', JSON.stringify(favoritos));
                if (favIcon) favIcon.classList.add('active');
                showToast('✅ Agregado a favoritos');
            } else {
                favoritos = favoritos.filter(f => f.slug !== slug);
                localStorage.setItem('misAnimes', JSON.stringify(favoritos));
                if (favIcon) favIcon.classList.remove('active');
                showToast('❌ Eliminado de favoritos');
            }
        }

        // Cargar resultados al iniciar (catálogo por defecto)
        window.onload = () => { cargarFiltrosDeURL(); ejecutarFiltro(); };

        // Mobile search function
        function buscarYRedirigirMobile() {
            const q = document.getElementById('input-buscador-mobile').value;
            if (q) window.location.href = `index.html?search=${encodeURIComponent(q)}`;
        }

        // HAMBURGER MENU LOGIC
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const navMenu = document.getElementById('nav-menu');

        if (hamburgerBtn && navMenu) {
            hamburgerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                navMenu.classList.toggle('active');
                hamburgerBtn.classList.toggle('active');
            });
            document.addEventListener('click', (e) => {
                if (!hamburgerBtn.contains(e.target) && !navMenu.contains(e.target)) {
                    navMenu.classList.remove('active');
                    hamburgerBtn.classList.remove('active');
                }
            });
        }

        // Toast notification
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._hide);
            t._hide = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Scroll-to-top
        document.addEventListener('scroll', () => {
            const btn = document.getElementById('scroll-top-btn');
            if (btn) btn.classList.toggle('visible', window.scrollY > 400);
        });

        // Ctrl+K / / para buscar
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey && e.key === 'k') || (!e.ctrlKey && !e.metaKey && e.key === '/' && !['INPUT','TEXTAREA'].includes(e.target.tagName))) {
                e.preventDefault();
                const input = document.getElementById('input-buscador') || document.getElementById('input-buscador-mobile');
                if (input) input.focus();
            }
        });
    </script>
    <div id="toast" class="toast"></div>
    <button id="scroll-top-btn" class="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

        @AlanFoaRostirolla - Animelandia 2026
    </footer>
