<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>404 - Animelandia</title>
    <base href="/">
    <link rel="icon" type="image/png" href="assets/img/Logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --racing-celeste: #00AEEF; --dark-bg: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; }
        body { background: var(--dark-bg); color: var(--text-color); font-family: 'Open Sans', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
        .logo { height: 80px; margin-bottom: 30px; }
        h1 { font-size: 120px; margin: 0; color: var(--racing-celeste); font-weight: 900; line-height: 1; }
        p { font-size: 18px; margin: 20px 0 30px; opacity: 0.8; }
        .btn { display: inline-block; padding: 14px 32px; background: var(--racing-celeste); color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: scale(1.05); }
    </style>
</head>
<body>
    <a href="/"><img class="logo" src="assets/img/Logo.png" alt="Animelandia - Inicio"></a>
    <h1>404</h1>
    <p>Esta página no existe o fue movida.<br>Pero no te preocupes, todo anime está acá.</p>
    <a class="btn" href="/">← VOLVER AL INICIO</a>
</body>
</html>
