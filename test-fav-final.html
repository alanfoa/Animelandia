<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Favorite Icon Final</title>
  <style>
    body {
      background: #1a1a2e;
      padding: 40px;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .card {
      background: #16213e;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      width: 200px;
      cursor: pointer;
    }
    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background: #000;
    }
    .btn-fav {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    .favorite-icon {
      width: 24px;
      height: 36px;
      transition: all 0.3s ease;
    }
    .favorite-icon .marker,
    .favorite-icon .star {
      transition: all 0.3s ease;
    }
    .favorite-icon .marker {
      fill: transparent;
      stroke: #000;
      stroke-width: 2;
      stroke-linejoin: round;
    }
    .favorite-icon .star {
      fill: transparent;
      stroke: #000;
      stroke-width: 2;
      stroke-linejoin: round;
    }
    .favorite-icon.active .marker {
      fill: #FFB800;
      stroke: #FFB800;
    }
    .favorite-icon.active .star {
      fill: #FFF;
      stroke: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://via.placeholder.com/200x280?text=Anime+1">
    <button class="btn-fav" onclick="this.querySelector('.favorite-icon').classList.toggle('active')">
      <svg class="favorite-icon" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
        <path class="marker" d="M5,2 L19,2 Q22,2 22,5 L22,28 L12,34 L2,28 L2,5 Q2,2 5,2 Z" />
        <path class="star" d="M12,10 L14,13 L18,14 L15,16 L16,20 L12,18 L8,20 L9,16 L6,14 L10,13 Z" />
      </svg>
    </button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200x280?text=Anime+2">
    <button class="btn-fav" onclick="this.querySelector('.favorite-icon').classList.toggle('active')">
      <svg class="favorite-icon active" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
        <path class="marker" d="M5,2 L19,2 Q22,2 22,5 L22,28 L12,34 L2,28 L2,5 Q2,2 5,2 Z" />
        <path class="star" d="M12,10 L14,13 L18,14 L15,16 L16,20 L12,18 L8,20 L9,16 L6,14 L10,13 Z" />
      </svg>
    </button>
  </div>

  <script>
    document.querySelectorAll('.btn-fav').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        this.querySelector('.favorite-icon').classList.toggle('active');
      });
    });
  </script>
</body>
</html>
